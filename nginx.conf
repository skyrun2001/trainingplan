server {
    listen 80;
    server_name trainingplan.local _;  # Anpassen: z.B. deine IP oder Domain

    root /home/user/trainingplan/public;
    index index.php;

    # Logs
    access_log /var/log/nginx/trainingplan_access.log;
    error_log  /var/log/nginx/trainingplan_error.log;

    # Symfony front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass   unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_param  APP_ENV         prod;
        fastcgi_param  APP_SECRET      CHANGE_ME_IN_ENV;  # besser via .env
        internal;
    }

    # Block direct access to other PHP files
    location ~ \.php$ {
        return 404;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin"         always;
    add_header Permissions-Policy        "camera=(), microphone=()" always;

    # Hide NGINX version
    server_tokens off;

    # Block dotfiles
    location ~ /\. {
        deny all;
    }

    # Block access to sensitive directories
    location ~ ^/(config|src|var|vendor|migrations|bin)/ {
        deny all;
    }
}
