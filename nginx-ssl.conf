# Optionale HTTPS-Konfiguration (z.B. mit self-signed cert für LAN)
# sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#   -keyout /etc/ssl/private/trainingplan.key \
#   -out /etc/ssl/certs/trainingplan.crt \
#   -subj "/CN=trainingplan.local"

server {
    listen 80;
    server_name trainingplan.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trainingplan.local _;

    ssl_certificate     /etc/ssl/certs/trainingplan.crt;
    ssl_certificate_key /etc/ssl/private/trainingplan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /home/user/trainingplan/public;
    index index.php;

    access_log /var/log/nginx/trainingplan_access.log;
    error_log  /var/log/nginx/trainingplan_error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_param  APP_ENV         prod;
        fastcgi_param  APP_SECRET      CHANGE_ME_IN_ENV;
        internal;
    }

    location ~ \.php$ { return 404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    server_tokens off;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.  { deny all; }
    location ~ ^/(config|src|var|vendor|migrations|bin)/ { deny all; }
}
