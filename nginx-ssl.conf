# HTTPS-Konfiguration — Voraussetzung: Zertifikat vorhanden
# Let's Encrypt:  sudo certbot --nginx -d training.DEINE-DOMAIN.de
# Self-signed:    sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#                   -keyout /etc/ssl/private/trainingplan.key \
#                   -out /etc/ssl/certs/trainingplan.crt \
#                   -subj "/CN=training.DEINE-DOMAIN.de"

server {
    listen 80;
    server_name training.DEINE-DOMAIN.de;  # <-- anpassen
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name training.192.168.178.124.de;  # <-- anpassen

    ssl_certificate     /etc/ssl/certs/trainingplan.crt;
    ssl_certificate_key /etc/ssl/private/trainingplan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/user/trainingplan/public;
    index index.php;

    client_max_body_size 2m;

    access_log /var/log/nginx/trainingplan_access.log;
    error_log  /var/log/nginx/trainingplan_error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass            unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include                 fastcgi_params;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param           DOCUMENT_ROOT   $realpath_root;
        internal;
    }

    location ~ \.php$ { return 404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    server_tokens off;
    add_header X-Frame-Options           "DENY"           always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header Referrer-Policy           "strict-origin"  always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"
        always;

    location ~ /\. { deny all; }
    location ~ ^/(config|src|var|vendor|migrations|bin)/ { deny all; }
}
